<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../../src/Zhengyan.DigitalWife.GamePlayer.Web/wwwroot/css/app.css">
<style>body{margin:0;min-width:0;background:transparent}.canvas-frame{position:relative;width:100vw;height:100vh;min-height:0;border:0;border-radius:0}#game-canvas,#overlay-canvas{position:absolute;inset:0;width:100%;height:100%;min-height:0;background:transparent}#overlay-canvas{pointer-events:none}</style>
<div class="canvas-frame"><canvas id="game-canvas"></canvas><canvas id="overlay-canvas"></canvas></div>
<script type="module">
import * as runtime from '../../src/Zhengyan.DigitalWife.GamePlayer.Web/wwwroot/js/web-runtime.js';
import * as asr from '../../src/Zhengyan.DigitalWife.GamePlayer.Web/wwwroot/js/web-asr.js';
window.calls=[];window.runtime=runtime;window.recognizers=[];window.microphoneCalls=0;window.microphoneFailure=null;
Object.defineProperty(navigator,'permissions',{configurable:true,value:{query:async()=>({state:'prompt'})}});
navigator.mediaDevices.getUserMedia=async()=>{window.microphoneCalls++;if(window.microphoneFailure)throw new DOMException('fixture',window.microphoneFailure);return {getTracks:()=>[{stop(){}}]};};
window.SpeechRecognition=class{constructor(){window.recognizers.push(this);}start(){this.starts=(this.starts||0)+1;}abort(){}stop(){this.onend?.();}};
window.startAsr=()=>asr.execute({operation:'wake',requestId:'wake',entityId:'actor',wakeWords:['hello'],errorCallback:'error'},
    {invokeMethodAsync:async(method,...args)=>{window.calls.push({method,args});if(args[1]?.eventName==='error')queueMicrotask(()=>window.startAsr());}});
window.stopAsr=()=>asr.stopAll();
const canvas=document.querySelector('#game-canvas'),overlay=document.querySelector('#overlay-canvas');
window.showMenu=(x=170*devicePixelRatio,y=130*devicePixelRatio)=>runtime.showContextMenu({id:'actor-menu',name:'Actor Menu',token:'token',x,y,width:150*devicePixelRatio,itemHeight:30*devicePixelRatio,paddingX:8*devicePixelRatio,paddingY:6*devicePixelRatio,fontSize:16*devicePixelRatio,rounding:8*devicePixelRatio,borderThickness:devicePixelRatio,background:'#243c55',color:'#fff',border:'#62887d',hover:'#456',active:'#789',items:[{id:'action',text:'Action',enabled:true}]});
runtime.start(canvas,overlay,{invokeMethodAsync:async(method,...args)=>{
    window.calls.push({method,args});
    if(method==='OnAnimationFrameWithInput'){const ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#35896a';ctx.fillRect(120*devicePixelRatio,60*devicePixelRatio,80*devicePixelRatio,220*devicePixelRatio);}
    if(method==='OnContextMenuRequest')window.showMenu(...args);
}});
runtime.configureGame(300,360,true,true);
runtime.setOverlayState({controls:[{id:'control',name:'Control',type:'button',x:20*devicePixelRatio,y:10*devicePixelRatio,width:80*devicePixelRatio,height:30*devicePixelRatio,fontSize:16*devicePixelRatio,text:'GUI'}]});
window.ready=true;
</script>
