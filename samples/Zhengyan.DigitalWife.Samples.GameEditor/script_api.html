<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GameEditor / GamePlayer 脚本 API</title>
  <style>
    :root {
      --bg: #f5efe5;
      --panel: #fffaf2;
      --panel-2: #f0dfc7;
      --ink: #211f1b;
      --muted: #6e665b;
      --line: #d5c2aa;
      --accent: #0f766e;
      --accent-2: #9a5b20;
      --code-bg: #17211d;
      --code-ink: #e9f5ef;
      --shadow: rgba(40, 29, 16, 0.14);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 12% 10%, rgba(15, 118, 110, 0.14), transparent 28rem),
        radial-gradient(circle at 88% 20%, rgba(154, 91, 32, 0.13), transparent 30rem),
        linear-gradient(180deg, #fff7ea, var(--bg));
      font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", sans-serif;
      line-height: 1.62;
    }

    a { color: var(--accent); }

    .layout {
      display: grid;
      grid-template-columns: 360px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
      padding: 22px 18px;
      border-right: 1px solid var(--line);
      background: rgba(255, 250, 242, 0.91);
      backdrop-filter: blur(12px);
    }

    .brand {
      padding-bottom: 16px;
      border-bottom: 1px solid var(--line);
    }

    .brand h1 {
      margin: 0 0 8px;
      font-size: 23px;
      line-height: 1.2;
    }

    .brand p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }

    .search {
      width: 100%;
      margin: 18px 0 10px;
      padding: 12px 13px;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--ink);
      background: #fffdf8;
      font: inherit;
      outline: none;
      box-shadow: 0 8px 22px rgba(45, 34, 22, 0.06);
    }

    .search:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(15, 118, 110, 0.12);
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin: 0 0 12px;
    }

    .chip {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 5px 9px;
      color: var(--ink);
      background: #fffdf8;
      font-size: 12px;
      cursor: pointer;
    }

    .chip.active {
      border-color: rgba(15, 118, 110, 0.45);
      color: #073f3a;
      background: rgba(15, 118, 110, 0.12);
      font-weight: 700;
    }

    .result-count {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 12px;
    }

    .doc-list {
      display: grid;
      gap: 8px;
    }

    .doc-button {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 11px 12px;
      color: var(--ink);
      background: rgba(255, 253, 248, 0.88);
      text-align: left;
      cursor: pointer;
    }

    .doc-button:hover,
    .doc-button.active {
      border-color: rgba(15, 118, 110, 0.48);
      background: rgba(15, 118, 110, 0.10);
    }

    .doc-title {
      display: block;
      font-weight: 800;
      line-height: 1.25;
    }

    .doc-summary {
      display: block;
      margin-top: 4px;
      color: var(--muted);
      font-size: 12px;
    }

    main {
      width: min(1200px, 100%);
      padding: 34px 42px 70px;
    }

    .hero,
    .content-card {
      border: 1px solid var(--line);
      border-radius: 16px;
      background: rgba(255, 250, 242, 0.92);
      box-shadow: 0 18px 42px var(--shadow);
    }

    .hero {
      margin-bottom: 18px;
      padding: 28px;
    }

    .hero h2 {
      margin: 0 0 8px;
      font-size: clamp(30px, 4vw, 44px);
      line-height: 1.08;
    }

    .hero p {
      max-width: 920px;
      margin: 0;
      color: var(--muted);
    }

    .content-card {
      padding: 28px;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 10px;
      margin: 18px 0 20px;
    }

    .meta-item {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 11px 12px;
      background: #fffdf8;
    }

    .meta-label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .meta-value {
      margin-top: 4px;
      font-weight: 700;
    }

    .doc-content h1,
    .doc-content h2,
    .doc-content h3 {
      line-height: 1.25;
    }

    .doc-content h1 {
      margin: 0 0 12px;
      font-size: 32px;
    }

    .doc-content h2 {
      margin: 30px 0 12px;
      padding-top: 14px;
      border-top: 1px solid var(--line);
      font-size: 23px;
    }

    .doc-content h3 {
      margin: 24px 0 10px;
      font-size: 18px;
    }

    .doc-content p {
      margin: 9px 0 14px;
    }

    .doc-content table {
      width: 100%;
      margin: 14px 0 18px;
      border-collapse: collapse;
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      background: #fffdf8;
    }

    .doc-content th,
    .doc-content td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--line);
      text-align: left;
      vertical-align: top;
    }

    .doc-content th {
      background: var(--panel-2);
      font-weight: 800;
    }

    .doc-content tr:last-child td {
      border-bottom: 0;
    }

    .doc-content code,
    .meta-value code {
      border-radius: 5px;
      padding: 2px 5px;
      color: #073f3a;
      background: rgba(15, 118, 110, 0.10);
      font-family: "Cascadia Mono", Consolas, monospace;
      font-size: 0.92em;
    }

    .doc-content pre {
      overflow: auto;
      padding: 15px 16px;
      border-radius: 12px;
      color: var(--code-ink);
      background: var(--code-bg);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.06);
    }

    .doc-content pre code {
      padding: 0;
      color: inherit;
      background: transparent;
    }

    .doc-content blockquote {
      margin: 14px 0;
      padding: 8px 14px;
      border-left: 4px solid var(--accent);
      background: rgba(15, 118, 110, 0.08);
    }

    .doc-content li {
      margin: 5px 0;
    }

    .empty {
      padding: 30px;
      color: var(--muted);
      text-align: center;
    }

    mark {
      border-radius: 3px;
      padding: 0 2px;
      color: inherit;
      background: rgba(242, 184, 84, 0.5);
    }

    @media (max-width: 900px) {
      .layout { display: block; }
      .sidebar {
        position: static;
        height: auto;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      main { padding: 22px 14px 48px; }
      .hero,
      .content-card { padding: 18px; }
      .doc-content table {
        display: block;
        overflow-x: auto;
      }
    }
  </style>
  <script src="api_docs/api_manifest.js"></script>
</head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="brand">
        <h1>脚本 API 检索</h1>
        <p>从 <code>api_docs</code> 模块文档加载。支持对象、属性、方法、参数和示例全文检索。</p>
      </div>
      <input id="searchInput" class="search" type="search" placeholder="搜索 API、对象、方法、参数，例如 Entity / SetVisible / clipboard">
      <div id="filters" class="filters"></div>
      <p id="resultCount" class="result-count"></p>
      <div id="docList" class="doc-list"></div>
    </aside>

    <main>
      <section class="hero">
        <h2>GameEditor / GamePlayer 脚本 API</h2>
        <p>根 Markdown 已拆分为模块文档。左侧检索后点击模块，可在这里查看该对象的属性表、方法参数说明和示例。通过本地文件直接打开时，页面使用 <code>api_manifest.js</code> 离线快照；通过 HTTP 服务打开时，会优先读取对应的 <code>api_docs/*.md</code> 文件。</p>
      </section>
      <section class="content-card">
        <div id="docView" class="doc-content"></div>
      </section>
    </main>
  </div>

  <script>
    const docs = Array.isArray(window.API_DOCS) ? window.API_DOCS : [];
    const searchInput = document.getElementById("searchInput");
    const filtersEl = document.getElementById("filters");
    const listEl = document.getElementById("docList");
    const countEl = document.getElementById("resultCount");
    const viewEl = document.getElementById("docView");
    let activeId = docs[0]?.id || "";
    let activeCategory = "全部";

    function escapeHtml(value) {
      return String(value ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function stripFrontMatter(markdown) {
      return String(markdown || "").replace(/^---[\s\S]*?---\s*/, "");
    }

    function inlineMarkdown(text) {
      let html = escapeHtml(text);
      html = html.replace(/`([^`]+)`/g, "<code>$1</code>");
      html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2">$1</a>');
      return html;
    }

    function parseTable(block) {
      const rows = block.trim().split(/\n/).filter(Boolean);
      if (rows.length < 2 || !rows[1].includes("---")) return null;
      const cells = row => row.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(item => item.trim());
      const headers = cells(rows[0]);
      const body = rows.slice(2).map(cells);
      return "<table><thead><tr>" + headers.map(item => `<th>${inlineMarkdown(item)}</th>`).join("") + "</tr></thead><tbody>" +
        body.map(row => "<tr>" + row.map(item => `<td>${inlineMarkdown(item)}</td>`).join("") + "</tr>").join("") +
        "</tbody></table>";
    }

    function markdownToHtml(markdown) {
      const source = stripFrontMatter(markdown).replace(/\r\n?/g, "\n");
      const chunks = [];
      let cursor = 0;
      const codeRegex = /```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g;
      let match;
      while ((match = codeRegex.exec(source))) {
        chunks.push({ type: "markdown", text: source.slice(cursor, match.index) });
        chunks.push({ type: "code", lang: match[1], text: match[2] });
        cursor = match.index + match[0].length;
      }
      chunks.push({ type: "markdown", text: source.slice(cursor) });

      return chunks.map(chunk => {
        if (chunk.type === "code") {
          return `<pre><code class="language-${escapeHtml(chunk.lang)}">${escapeHtml(chunk.text.trimEnd())}</code></pre>`;
        }

        const lines = chunk.text.split("\n");
        const parts = [];
        let paragraph = [];
        let list = [];
        let table = [];

        function flushParagraph() {
          if (paragraph.length) {
            parts.push(`<p>${inlineMarkdown(paragraph.join(" "))}</p>`);
            paragraph = [];
          }
        }

        function flushList() {
          if (list.length) {
            parts.push("<ul>" + list.map(item => `<li>${inlineMarkdown(item)}</li>`).join("") + "</ul>");
            list = [];
          }
        }

        function flushTable() {
          if (table.length) {
            const parsed = parseTable(table.join("\n"));
            parts.push(parsed || `<p>${inlineMarkdown(table.join(" "))}</p>`);
            table = [];
          }
        }

        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed) {
            flushParagraph();
            flushList();
            flushTable();
            continue;
          }
          if (/^\|.*\|$/.test(trimmed)) {
            flushParagraph();
            flushList();
            table.push(trimmed);
            continue;
          }
          flushTable();
          const heading = /^(#{1,6})\s+(.+)$/.exec(trimmed);
          if (heading) {
            flushParagraph();
            flushList();
            const level = Math.min(heading[1].length, 3);
            parts.push(`<h${level}>${inlineMarkdown(heading[2])}</h${level}>`);
            continue;
          }
          const bullet = /^[-*]\s+(.+)$/.exec(trimmed);
          if (bullet) {
            flushParagraph();
            list.push(bullet[1]);
            continue;
          }
          paragraph.push(trimmed);
        }

        flushParagraph();
        flushList();
        flushTable();
        return parts.join("\n");
      }).join("\n");
    }

    function docSearchText(doc) {
      return [
        doc.title,
        doc.category,
        doc.summary,
        doc.csharpEntry,
        doc.pythonEntry,
        ...(doc.objects || []),
        ...(doc.keywords || []),
        doc.searchText,
        doc.content
      ].join(" ").toLowerCase();
    }

    function filteredDocs() {
      const query = searchInput.value.trim().toLowerCase();
      return docs.filter(doc => {
        const categoryOk = activeCategory === "全部" || doc.category === activeCategory;
        const queryOk = !query || docSearchText(doc).includes(query);
        return categoryOk && queryOk;
      });
    }

    function renderFilters() {
      const categories = ["全部", ...Array.from(new Set(docs.map(doc => doc.category))).sort()];
      filtersEl.innerHTML = categories.map(category =>
        `<button class="chip ${category === activeCategory ? "active" : ""}" data-category="${escapeHtml(category)}">${escapeHtml(category)}</button>`
      ).join("");
      filtersEl.querySelectorAll("button").forEach(button => {
        button.addEventListener("click", () => {
          activeCategory = button.dataset.category || "全部";
          render();
        });
      });
    }

    function renderList() {
      const matches = filteredDocs();
      countEl.textContent = `${matches.length} / ${docs.length} 个模块`;
      if (!matches.some(doc => doc.id === activeId)) {
        activeId = matches[0]?.id || docs[0]?.id || "";
      }
      listEl.innerHTML = matches.map(doc => `
        <button class="doc-button ${doc.id === activeId ? "active" : ""}" data-id="${escapeHtml(doc.id)}">
          <span class="doc-title">${escapeHtml(doc.title)}</span>
          <span class="doc-summary">${escapeHtml(doc.summary)}</span>
        </button>
      `).join("") || '<div class="empty">没有匹配的 API 模块。</div>';
      listEl.querySelectorAll("button").forEach(button => {
        button.addEventListener("click", () => selectDoc(button.dataset.id));
      });
    }

    async function loadMarkdown(doc) {
      if (!doc) return "";
      try {
        if (location.protocol !== "file:") {
          const response = await fetch(doc.file, { cache: "no-cache" });
          if (response.ok) return await response.text();
        }
      } catch {
        // Local file mode and strict browser policies fall back to the bundled snapshot.
      }
      return doc.content || "";
    }

    async function selectDoc(id) {
      activeId = id;
      renderList();
      const doc = docs.find(item => item.id === activeId);
      if (!doc) {
        viewEl.innerHTML = '<div class="empty">没有可显示的文档。</div>';
        return;
      }
      const markdown = await loadMarkdown(doc);
      viewEl.innerHTML = `
        <h1>${escapeHtml(doc.title)}</h1>
        <p>${escapeHtml(doc.summary)}</p>
        <div class="meta-grid">
          <div class="meta-item"><div class="meta-label">分类</div><div class="meta-value">${escapeHtml(doc.category)}</div></div>
          <div class="meta-item"><div class="meta-label">C# 入口</div><div class="meta-value"><code>${escapeHtml(doc.csharpEntry || "")}</code></div></div>
          <div class="meta-item"><div class="meta-label">Python 入口</div><div class="meta-value"><code>${escapeHtml(doc.pythonEntry || "")}</code></div></div>
          <div class="meta-item"><div class="meta-label">模块文件</div><div class="meta-value"><a href="${escapeHtml(doc.file)}">${escapeHtml(doc.file)}</a></div></div>
        </div>
        ${markdownToHtml(markdown)}
      `;
      history.replaceState(null, "", "#" + encodeURIComponent(activeId));
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function render() {
      renderFilters();
      renderList();
      selectDoc(activeId);
    }

    searchInput.addEventListener("input", () => {
      const matches = filteredDocs();
      activeId = matches[0]?.id || "";
      renderList();
      selectDoc(activeId);
    });

    if (location.hash.length > 1) {
      activeId = decodeURIComponent(location.hash.slice(1));
    }

    if (!docs.length) {
      viewEl.innerHTML = '<div class="empty">没有加载到 api_docs/api_manifest.js。请确认该文件存在。</div>';
    } else {
      render();
    }
  </script>
</body>
</html>
